<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>
  <rect width="900" height="480" rx="16" fill="url(#legGrad)" />
  
  <text x="450" y="42" text-anchor="middle" fill="#FBBF24" font-family="Cairo, sans-serif" font-size="20" font-weight="bold">مسار الحماية والردع القانوني لاتحاد الشاغلين (قانون 119 لسنة 2008)</text>
  <text x="450" y="68" text-anchor="middle" fill="#CBD5E1" font-family="Cairo, sans-serif" font-size="12">من الجمعية التأسيسية وإشهار الحي إلى أمر الأداء القضائي المباشر وحظر التصرف</text>

  <!-- Step 1 -->
  <g transform="translate(680, 95)">
    <rect width="185" height="320" rx="12" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="2"/>
    <rect width="185" height="38" rx="10" fill="#1E3A8A"/>
    <text x="92" y="24" text-anchor="middle" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="13" font-weight="bold">1. التأسيس والإشهار</text>
    <circle cx="92" cy="72" r="22" fill="#DBEAFE"/>
    <text x="92" y="79" text-anchor="middle" font-size="18">📜</text>
    <text x="92" y="118" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">دعوة الجمعية العمومية</text>
    <text x="92" y="136" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">حضور الأغلبية المطلقة</text>
    <text x="92" y="165" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">انتخاب مجلس الإدارة</text>
    <text x="92" y="183" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">رئيس الاتحاد + أمين الصندوق</text>
    <text x="92" y="212" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">إيداع أوراق الحي</text>
    <text x="92" y="230" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">استخراج شهادة القيد الرسمية</text>
    <rect x="15" y="265" width="155" height="32" rx="6" fill="#EFF6FF"/>
    <text x="92" y="285" text-anchor="middle" fill="#1D4ED8" font-family="Cairo, sans-serif" font-size="11" font-weight="bold">اكتساب الشخصية الاعتبارية</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(460, 95)">
    <rect width="185" height="320" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="2"/>
    <rect width="185" height="38" rx="10" fill="#047857"/>
    <text x="92" y="24" text-anchor="middle" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="13" font-weight="bold">2. إقرار اللائحة والمالية</text>
    <circle cx="92" cy="72" r="22" fill="#D1FAE5"/>
    <text x="92" y="79" text-anchor="middle" font-size="18">📋</text>
    <text x="92" y="118" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">اعتماد اللائحة الداخلية</text>
    <text x="92" y="136" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">تحديد واجبات الشاغلين</text>
    <text x="92" y="165" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">إقرار موازنة الـ 12 شهراً</text>
    <text x="92" y="183" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">تحديد قيمة الاشتراك العادل</text>
    <text x="92" y="212" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">فتح الحساب البنكي</text>
    <text x="92" y="230" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">حساب رسمي باسم الاتحاد</text>
    <rect x="15" y="265" width="155" height="32" rx="6" fill="#ECFDF5"/>
    <text x="92" y="285" text-anchor="middle" fill="#047857" font-family="Cairo, sans-serif" font-size="11" font-weight="bold">القرارات نافذة وملزمة للكافة</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(240, 95)">
    <rect width="185" height="320" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="2"/>
    <rect width="185" height="38" rx="10" fill="#B45309"/>
    <text x="92" y="24" text-anchor="middle" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="13" font-weight="bold">3. الإنذار الرسمي</text>
    <circle cx="92" cy="72" r="22" fill="#FEF3C7"/>
    <text x="92" y="79" text-anchor="middle" font-size="18">✉️</text>
    <text x="92" y="118" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">حصر متأخرات السداد</text>
    <text x="92" y="136" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">تأخر شهرين فأكثر</text>
    <text x="92" y="165" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">إنذار على يد محضر</text>
    <text x="92" y="183" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">تكليف رسمي بالوفاء</text>
    <text x="92" y="212" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">مهلة الـ 15 يوماً</text>
    <text x="92" y="230" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">المهلة الإلزامية قبل القضاء</text>
    <rect x="15" y="265" width="155" height="32" rx="6" fill="#FFFBEB"/>
    <text x="92" y="285" text-anchor="middle" fill="#B45309" font-family="Cairo, sans-serif" font-size="11" font-weight="bold">قطع حجة عدم العلم</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(20, 95)">
    <rect width="185" height="320" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="2"/>
    <rect width="185" height="38" rx="10" fill="#B91C1C"/>
    <text x="92" y="24" text-anchor="middle" fill="#FFFFFF" font-family="Cairo, sans-serif" font-size="13" font-weight="bold">4. التنفيذ الجبري</text>
    <circle cx="92" cy="72" r="22" fill="#FEE2E2"/>
    <text x="92" y="79" text-anchor="middle" font-size="18">⚖️</text>
    <text x="92" y="118" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">أمر أداء قضائي</text>
    <text x="92" y="136" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">استصدار أمر أداء سريع</text>
    <text x="92" y="165" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">الحجز التنفيذي</text>
    <text x="92" y="183" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">حجز منقولات أو حساب بنكي</text>
    <text x="92" y="212" text-anchor="middle" fill="#1E293B" font-family="Cairo, sans-serif" font-size="12" font-weight="bold">حظر الشهر العقاري</text>
    <text x="92" y="230" text-anchor="middle" fill="#64748B" font-family="Cairo, sans-serif" font-size="10.5">منع بيع الشقة دون مخالصة</text>
    <rect x="15" y="265" width="155" height="32" rx="6" fill="#FEF2F2"/>
    <text x="92" y="285" text-anchor="middle" fill="#B91C1C" font-family="Cairo, sans-serif" font-size="11" font-weight="bold">استرداد الحقوق بقوة السند</text>
  </g>

  <!-- Footer Banner -->
  <rect x="20" y="430" width="860" height="36" rx="8" fill="#1E293B" />
  <text x="450" y="453" text-anchor="middle" fill="#FCD34D" font-family="Cairo, sans-serif" font-size="11.5" font-weight="bold">المادة 77 من القانون 119 لسنة 2008: «تعتبر قرارات الجمعية العمومية للاتحاد ملزمة للكافة وتنفذ بذاتها»</text>
</svg>