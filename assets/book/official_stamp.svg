<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="160" height="160">
  <defs>
    <filter id="stamp-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1A365D" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#1A365D" stroke-width="4" stroke-dasharray="8 3" opacity="0.85"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#1A365D" stroke-width="2"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#1A365D" stroke-width="1.5"/>
  
  <!-- Curved Text Top -->
  <path id="curve-top" d="M 28 100 A 72 72 0 0 1 172 100" fill="none"/>
  <text font-family="'Cairo', sans-serif" font-size="12" font-weight="900" fill="#1A365D" letter-spacing="1.5">
    <textPath href="#curve-top" startOffset="50%" text-anchor="middle">
      اتحاد شاغلي عقار • جمهورية مصر العربية
    </textPath>
  </text>

  <!-- Curved Text Bottom -->
  <path id="curve-bottom" d="M 172 100 A 72 72 0 0 1 28 100" fill="none"/>
  <text font-family="'Cairo', sans-serif" font-size="11" font-weight="800" fill="#1A365D" letter-spacing="1">
    <textPath href="#curve-bottom" startOffset="50%" text-anchor="middle">
      قانون البناء 119 لسنة 2008 • معتمد
    </textPath>
  </text>

  <!-- Center Motif -->
  <g transform="translate(100, 100) scale(0.9)">
    <!-- Building Icon -->
    <path d="M -22 25 L -22 -15 L 0 -30 L 22 -15 L 22 25 Z" fill="none" stroke="#1A365D" stroke-width="2"/>
    <!-- Windows -->
    <rect x="-14" y="-8" width="8" height="8" rx="1" fill="#1A365D"/>
    <rect x="6" y="-8" width="8" height="8" rx="1" fill="#1A365D"/>
    <rect x="-14" y="6" width="8" height="8" rx="1" fill="#1A365D"/>
    <rect x="6" y="6" width="8" height="8" rx="1" fill="#1A365D"/>
    <!-- Door -->
    <path d="M -5 25 L -5 16 A 5 5 0 0 1 5 16 L 5 25 Z" fill="#1A365D"/>
    <!-- Stars -->
    <text x="0" y="38" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9" font-weight="900" fill="#1A365D">★ مجلس الإدارة ★</text>
  </g>
</svg>