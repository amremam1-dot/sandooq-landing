<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="80" height="80">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B6CB0"/>
      <stop offset="100%" stop-color="#1A365D"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Background Circle with Gold Border -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)" stroke="#D97706" stroke-width="3"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="#FDE68A" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Shoulders & Coat -->
  <path d="M 22 105 C 25 82 42 78 60 78 C 78 78 95 82 98 105 Z" fill="#374151"/>
  <!-- White Shirt Collar & Burgundy Tie -->
  <polygon points="50,78 60,92 70,78" fill="#FFFFFF"/>
  <polygon points="57,86 63,86 64,105 56,105" fill="#991B1B"/>

  <!-- Neck -->
  <rect x="52" y="68" width="16" height="14" fill="#FBBF24" rx="3"/>

  <!-- Face -->
  <ellipse cx="60" cy="50" rx="22" ry="24" fill="url(#skinGrad)"/>

  <!-- Gray Hair at Temples -->
  <path d="M 37 46 C 36 34 44 26 60 26 C 76 26 84 34 83 46 C 81 38 74 30 60 30 C 46 30 39 38 37 46 Z" fill="#9CA3AF"/>
  <path d="M 36 46 C 34 50 34 56 37 60 C 37 54 38 50 40 47 Z" fill="#9CA3AF"/>
  <path d="M 84 46 C 86 50 86 56 83 60 C 83 54 82 50 80 47 Z" fill="#9CA3AF"/>

  <!-- Eyebrows (Wise, slightly arched) -->
  <path d="M 46 41 Q 52 38 57 41" fill="none" stroke="#4B5563" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 63 41 Q 68 38 74 41" fill="none" stroke="#4B5563" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes with warm crow's feet -->
  <circle cx="51" cy="46" r="2.5" fill="#1F2937"/>
  <circle cx="69" cy="46" r="2.5" fill="#1F2937"/>

  <!-- Reading Glasses (Tortoise shell style) -->
  <rect x="42" y="41" width="16" height="11" rx="4" fill="none" stroke="#78350F" stroke-width="2"/>
  <rect x="62" y="41" width="16" height="11" rx="4" fill="none" stroke="#78350F" stroke-width="2"/>
  <line x1="58" y1="46" x2="62" y2="46" stroke="#78350F" stroke-width="2"/>

  <!-- Big Egyptian Mustache (وقور وضاحك) -->
  <path d="M 44 58 Q 54 54 60 58 Q 66 54 76 58 Q 68 66 60 62 Q 52 66 44 58 Z" fill="#4B5563"/>

  <!-- Friendly Smile underneath -->
  <path d="M 52 64 Q 60 69 68 64" fill="none" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>
</svg>