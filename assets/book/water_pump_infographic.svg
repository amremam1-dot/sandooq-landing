<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="auto">
  <!-- Outer Card -->
  <rect x="10" y="10" width="580" height="300" rx="12" fill="#FFFFFF" stroke="#CBD5E0" stroke-width="2"/>
  
  <!-- Header Banner -->
  <rect x="10" y="10" width="580" height="42" rx="12" fill="#0284C7"/>
  <rect x="10" y="32" width="580" height="20" fill="#0284C7"/>
  <text x="300" y="36" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">
    معركة المواتير: جهاز الفلوماك الذكي vs نظام البالونة القديم
  </text>

  <!-- Left Side: Flow Switch (الفلوماك الذكي) -->
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="255" height="230" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#16A34A"/>
    <rect x="0" y="20" width="255" height="14" fill="#16A34A"/>
    <text x="127" y="24" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">
      الفلوماك الإلكتروني الذكي (Flow Switch)
    </text>

    <!-- Rating Stars -->
    <text x="127" y="58" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="14" fill="#D97706">★★★★★ (الخيار الموصى به)</text>

    <!-- Pros -->
    <text x="15" y="85" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#15803D">✔ حماية الماتور من الحرق بنسبة 100%:</text>
    <text x="25" y="103" font-family="'Cairo', sans-serif" font-size="10" fill="#374151">يفصل أوتوماتيكياً فور انقطاع مياه البلدية ويمنع التشغيل الجاف.</text>

    <text x="15" y="128" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#15803D">✔ ذكاء فوري وتشغيل لحظي:</text>
    <text x="25" y="146" font-family="'Cairo', sans-serif" font-size="10" fill="#374151">يعمل فور فتح الصنبور ويفصل فوراً عند الإغلاق دون تأخير.</text>

    <text x="15" y="171" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#15803D">✔ صفر صيانة دورية:</text>
    <text x="25" y="189" font-family="'Cairo', sans-serif" font-size="10" fill="#374151">لا يحتاج شحن هواء، ولا يصدأ، ولا يحتوي على كاوتشوك يتلف.</text>

    <!-- Best For -->
    <rect x="15" y="202" width="225" height="20" rx="4" fill="#DCFCE7"/>
    <text x="127" y="216" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9.5" font-weight="800" fill="#166534">يناسب: العمارات حتى 7 أدوار والأحياء ذات الضغط المتغير</text>
  </g>

  <!-- Right Side: Balloon / Mechanical (نظام البالونة القديم) -->
  <g transform="translate(315, 65)">
    <rect x="0" y="0" width="255" height="230" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <rect x="0" y="0" width="255" height="34" rx="10" fill="#DC2626"/>
    <rect x="0" y="20" width="255" height="14" fill="#DC2626"/>
    <text x="127" y="24" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">
      نظام البالونة والمفتاح الميكانيكي القديم
    </text>

    <!-- Rating Stars -->
    <text x="127" y="58" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="14" fill="#6B7280">★★☆☆☆ (نظام تقليدي مجهد)</text>

    <!-- Cons -->
    <text x="15" y="85" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#B91C1C">✖ خطر احتراق الماتور المتكرر:</text>
    <text x="25" y="103" font-family="'Cairo', sans-serif" font-size="10" fill="#374151">يظل يعمل على الجاف لو قطعت المياه ويسخن حتى يحترق النحاس!</text>

    <text x="15" y="128" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#B91C1C">✖ ثقب البالونة الداخلية المتكرر:</text>
    <text x="25" y="146" font-family="'Cairo', sans-serif" font-size="10" fill="#374151">ثقب الكاوتشوك يسبب تشغيل وفصل الماتور كل ثانية كالمجنون.</text>

    <text x="15" y="171" font-family="'Cairo', sans-serif" font-size="11" font-weight="700" fill="#B91C1C">✖ صيانة وصدأ مستمر:</text>
    <text x="25" y="189" font-family="'Cairo', sans-serif" font-size="10" fill="#374151">البالونة الحديدية تصدأ سريعاً وتلوث مياه الشرب ببرادة الحديد.</text>

    <!-- Note -->
    <rect x="15" y="202" width="225" height="20" rx="4" fill="#FEE2E2"/>
    <text x="127" y="216" text-anchor="middle" font-family="'Cairo', sans-serif" font-size="9.5" font-weight="800" fill="#991B1B">توصية عم أمين: استبدله بفلوماك إيطالي أصلي فوراً ووفر فلوسك</text>
  </g>
</svg>