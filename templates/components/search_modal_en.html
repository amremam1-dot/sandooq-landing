<!-- Sandooq El-Amara — Global Command Palette Search Modal (EN) -->
<div id="search-modal" class="search-modal-backdrop" style="display: none;" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="search-modal-label">
  <div class="search-modal-dialog">
    <div class="search-modal-header">
      <div class="search-modal-input-wrapper">
        <svg class="search-modal-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="search-modal-input" class="search-modal-input" placeholder="Search 120+ guides, 70+ calculators & tools, and solutions... (Esc to close)" aria-label="Search Sandooq El-Amara guides and tools" autocomplete="off" />
      </div>
      <button type="button" id="search-modal-close" class="search-modal-close" aria-label="Close search (Esc)">&times;</button>
    </div>

    <!-- Category Filter Tabs inside Modal -->
    <div class="search-modal-tabs" role="tablist" aria-label="Filter search results">
      <button type="button" class="search-filter-tab active" data-filter="all" role="tab" aria-selected="true">All</button>
      <button type="button" class="search-filter-tab" data-filter="guides" role="tab" aria-selected="false">Guides</button>
      <button type="button" class="search-filter-tab" data-filter="tools" role="tab" aria-selected="false">Calculators & Tools</button>
      <button type="button" class="search-filter-tab" data-filter="solutions" role="tab" aria-selected="false">Solutions</button>
    </div>

    <div id="search-modal-results" class="search-modal-results" role="region" aria-live="polite">
      <!-- Dynamic search results populated by js/search.js -->
      <div class="search-empty-state no-results" style="display:none;">
        <p>No results found for your search</p>
      </div>
    </div>

    <div class="search-modal-footer">
      <div class="search-shortcuts-hints">
        <span><kbd>↑</kbd> <kbd>↓</kbd> to navigate</span>
        <span><kbd>Enter</kbd> to open</span>
        <span><kbd>Esc</kbd> to close</span>
      </div>
      <div class="search-modal-brand-note">
        <span>Sandooq El-Amara • Instant Search</span>
      </div>
    </div>
  </div>
</div>
